name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build the deployed publication (docs/)
        run: python3 tools/build.py
      - name: Release gate — publication
        run: python3 tools/checks.py
      # Fails the deploy if the stylesheet does not parse or does not reach the
      # markup. Added after 2026-11-20, when all 30 pages shipped with git
      # conflict markers in site.css and nothing in this repo could see it
      # (no session has ever rendered a page in this sandbox).
      - name: Release gate — stylesheet
        run: python3 tools/design_qa.py
      - name: Build the preserved Countercraft site (site/)
        run: python3 scripts/build_site.py
      - name: Release gate — Countercraft
        run: python3 scripts/verify_site.py
      - uses: actions/configure-pages@v5
        with:
          # Publishing root is docs/ ONLY. The repository root must never be the
          # Pages source again: serving the root would expose data/, content/,
          # tools/ and .git-adjacent config as static files (flags F-P19/F-P20).
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
