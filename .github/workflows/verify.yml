name: verify-site

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the deployed publication
        run: python3 tools/build.py
      - name: Verify the deployed publication
        run: python3 tools/checks.py
      - name: Publication build is reproducible (committed docs/ matches the build)
        run: git diff --exit-code -- docs/
      - name: Build the Countercraft site
        run: python3 scripts/build_site.py
      - name: Verify the Countercraft site
        run: python3 scripts/verify_site.py
      - name: Countercraft build is reproducible (committed site/ matches the build)
        run: git diff --exit-code -- site/
